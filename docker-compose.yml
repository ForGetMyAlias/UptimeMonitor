services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uptime_db
      POSTGRES_USER: uptime_user
      POSTGRES_PASSWORD: uptime_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime_user -d uptime_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: uvicorn src.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://uptime_user:uptime_password@db:5432/uptime_db

  worker:
    build: .
    command: python -m src.worker
    depends_on:
      web:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://uptime_user:uptime_password@db:5432/uptime_db

volumes:
  pgdata:
