version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uptime_db
      POSTGRES_USER: uptime_user
      POSTGRES_PASSWORD: uptime_password
    ports:
      - "5432:5432"
  web:
    build: .
    command: uv run uvicorn src.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+asyncpg://uptime_user:uptime_password@db:5432/uptime_db

  worker:
    build: .
    command: uv run python -m src.worker
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+asyncpg://uptime_user:uptime_password@db:5432/uptime_db