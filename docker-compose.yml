services:
  db:
    image: postgres:16-alpine
    container_name: uptime_db
    environment:
      POSTGRES_USER: uptime_user
      POSTGRES_PASSWORD: uptime_password
      POSTGRES_DB: uptime_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime_user -d uptime_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: uptime_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://uptime_user:uptime_password@db:5432/uptime_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  postgres_data: